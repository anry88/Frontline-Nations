spring:
  application:
    name: frontline-nations
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/frontline}
    username: ${DATABASE_USER:frontline}
    password: ${DATABASE_PASSWORD:frontline}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

frontline:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  game-timezone: ${GAME_TIMEZONE:Europe/Belgrade}
  battle-server-salt: ${BATTLE_SERVER_SALT:local-development-only}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:0}
  replay:
    ffmpeg-path: ${REPLAY_FFMPEG_PATH:ffmpeg}
    cache-directory: ${REPLAY_CACHE_DIRECTORY:/tmp/frontline-replays}
    width: ${REPLAY_WIDTH:768}
    fps: ${REPLAY_FPS:3}
    retention-hours: ${REPLAY_RETENTION_HOURS:48}
    weekly-retention-hours: ${REPLAY_WEEKLY_RETENTION_HOURS:168}
  campaign:
    resolve-cron: ${CAMPAIGN_RESOLVE_CRON:0 0 15 * * SUN}
    retry-cron: ${CAMPAIGN_RETRY_CRON:0 5/10 * * * *}
    open-cron: ${CAMPAIGN_OPEN_CRON:0 5 0 * * MON}
    max-ticks: ${CAMPAIGN_MAX_TICKS:96}
    objective-base-points: ${CAMPAIGN_OBJECTIVE_BASE_POINTS:1000}
    objective-decay-per-tick: ${CAMPAIGN_OBJECTIVE_DECAY_PER_TICK:15}
    objective-min-points: ${CAMPAIGN_OBJECTIVE_MIN_POINTS:200}
    survivor-score-percent: ${CAMPAIGN_SURVIVOR_SCORE_PERCENT:50}
    npc-min-cp: ${CAMPAIGN_NPC_MIN_CP:10}
    npc-max-cp: ${CAMPAIGN_NPC_MAX_CP:25}
    winner-xp: ${CAMPAIGN_WINNER_XP:600}
    loser-xp: ${CAMPAIGN_LOSER_XP:250}
    winner-credits: ${CAMPAIGN_WINNER_CREDITS:90}
    loser-credits: ${CAMPAIGN_LOSER_CREDITS:30}
    winner-materials: ${CAMPAIGN_WINNER_MATERIALS:30}
    loser-materials: ${CAMPAIGN_LOSER_MATERIALS:16}
    destroyed-credits-per100-power: ${CAMPAIGN_DESTROYED_CREDITS_PER100_POWER:1}
    destroyed-xp-per100-power: ${CAMPAIGN_DESTROYED_XP_PER100_POWER:50}
    capture-credits: ${CAMPAIGN_CAPTURE_CREDITS:5}
    capture-xp: ${CAMPAIGN_CAPTURE_XP:100}
    victory-bonus-percent: ${CAMPAIGN_VICTORY_BONUS_PERCENT:120}
    victory-bonus-days: ${CAMPAIGN_VICTORY_BONUS_DAYS:7}
