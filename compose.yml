name: ${COMPOSE_PROJECT_NAME:-frontline-nations}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-frontline}
      POSTGRES_USER: ${POSTGRES_USER:-frontline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    image: ${FRONTLINE_IMAGE:-frontline-nations:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-frontline}
      DATABASE_USER: ${POSTGRES_USER:-frontline}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-0}
      BATTLE_SERVER_SALT: ${BATTLE_SERVER_SALT:?BATTLE_SERVER_SALT is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://frontline-nations.tg-games.com}
      GAME_TIMEZONE: ${GAME_TIMEZONE:-UTC}
      REPLAY_CACHE_DIRECTORY: ${REPLAY_CACHE_DIRECTORY:-/var/cache/frontline-replays}
      REPLAY_WIDTH: ${REPLAY_WIDTH:-768}
      REPLAY_FPS: ${REPLAY_FPS:-3}
      REPLAY_RETENTION_HOURS: ${REPLAY_RETENTION_HOURS:-48}
      REPLAY_WEEKLY_RETENTION_HOURS: ${REPLAY_WEEKLY_RETENTION_HOURS:-168}
      CAMPAIGN_MAX_TICKS: ${CAMPAIGN_MAX_TICKS:-120}
      CAMPAIGN_OBJECTIVE_BASE_POINTS: ${CAMPAIGN_OBJECTIVE_BASE_POINTS:-1000}
      CAMPAIGN_OBJECTIVE_DECAY_PER_TICK: ${CAMPAIGN_OBJECTIVE_DECAY_PER_TICK:-15}
      CAMPAIGN_OBJECTIVE_MIN_POINTS: ${CAMPAIGN_OBJECTIVE_MIN_POINTS:-200}
      CAMPAIGN_SURVIVOR_SCORE_PERCENT: ${CAMPAIGN_SURVIVOR_SCORE_PERCENT:-50}
      CAMPAIGN_INITIAL_RATING: ${CAMPAIGN_INITIAL_RATING:-10000}
      CAMPAIGN_LOSER_RATING_MINIMUM_LOSS_PERCENT: ${CAMPAIGN_LOSER_RATING_MINIMUM_LOSS_PERCENT:-2}
      CAMPAIGN_LOSER_RATING_MAXIMUM_LOSS_PERCENT: ${CAMPAIGN_LOSER_RATING_MAXIMUM_LOSS_PERCENT:-15}
      CAMPAIGN_NPC_MIN_CP: ${CAMPAIGN_NPC_MIN_CP:-10}
      CAMPAIGN_NPC_MAX_CP: ${CAMPAIGN_NPC_MAX_CP:-25}
      CAMPAIGN_WINNER_XP: ${CAMPAIGN_WINNER_XP:-600}
      CAMPAIGN_LOSER_XP: ${CAMPAIGN_LOSER_XP:-250}
      CAMPAIGN_WINNER_CREDITS: ${CAMPAIGN_WINNER_CREDITS:-90}
      CAMPAIGN_LOSER_CREDITS: ${CAMPAIGN_LOSER_CREDITS:-30}
      CAMPAIGN_WINNER_MATERIALS: ${CAMPAIGN_WINNER_MATERIALS:-30}
      CAMPAIGN_LOSER_MATERIALS: ${CAMPAIGN_LOSER_MATERIALS:-16}
      CAMPAIGN_DESTROYED_CREDITS_PER100_POWER: ${CAMPAIGN_DESTROYED_CREDITS_PER100_POWER:-1}
      CAMPAIGN_DESTROYED_XP_PER100_POWER: ${CAMPAIGN_DESTROYED_XP_PER100_POWER:-50}
      CAMPAIGN_CAPTURE_CREDITS: ${CAMPAIGN_CAPTURE_CREDITS:-5}
      CAMPAIGN_CAPTURE_XP: ${CAMPAIGN_CAPTURE_XP:-100}
      CAMPAIGN_VICTORY_BONUS_PERCENT: ${CAMPAIGN_VICTORY_BONUS_PERCENT:-120}
      CAMPAIGN_VICTORY_BONUS_DAYS: ${CAMPAIGN_VICTORY_BONUS_DAYS:-7}
      PORT: 8080
      MANAGEMENT_PORT: 9090
    expose:
      - "8080"
      - "9090"
    networks:
      default:
      tunnel:
        aliases:
          - ${TUNNEL_APP_ALIAS:-frontline-nations-prod-app}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - type: bind
        source: ${REPLAY_DATA_DIR:?REPLAY_DATA_DIR is required}
        target: /var/cache/frontline-replays

networks:
  tunnel:
    external: true
    name: ${HDC_TUNNEL_NETWORK:-hdc-tunnel}
